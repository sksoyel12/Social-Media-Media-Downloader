kind = "web"
previewPath = "/"
title = "Social Media Downloader"
description = "A fast, ad-free tool for preparing downloads from public social media posts that users are authorized to save. Supports TikTok, Instagram, and Pinterest links with clear video and image results."
version = "1.0.0"
id = "artifacts/social-media-downloader"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25289

[services.development]
run = "pnpm --filter @workspace/social-media-downloader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-media-downloader", "run", "build" ]
serve = "static"
publicDir = "artifacts/social-media-downloader/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25289"
BASE_PATH = "/"
